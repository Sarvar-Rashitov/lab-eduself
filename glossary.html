<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizika Lug'ati - Virtual Fizika Laboratoriyalari</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Navigation -->
    <nav class="py-4">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="text-4xl animate-bounce">⚛️</div>
                    <a href="index.html" class="hover:opacity-80 transition">
                        <h1 class="text-2xl font-bold text-white">Virtual Physics Lab</h1>
                        <p class="text-base text-yellow-300 font-semibold">✨ EduSelf</p>
                    </a>
                </div>
                
                <!-- Navigation Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="labs.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-flask mr-2"></i>Laboratoriyalar
                    </a>
                    <a href="categories.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-th-large mr-2"></i>Kategoriyalar
                    </a>
                    <a href="glossary.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-book mr-2"></i>Lug'at
                    </a>
                    <a href="about.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-info-circle mr-2"></i>Biz haqimizda
                    </a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <select id="langSwitch" class="bg-white/20 text-white px-3 py-2 rounded-full backdrop-blur-lg border border-white/30 text-sm font-semibold" style="color: white;">
                        <option value="uz" style="background-color: #1e293b; color: white;">UZ</option>
                        <option value="ru" style="background-color: #1e293b; color: white;">RU</option>
                        <option value="en" style="background-color: #1e293b; color: white;">EN</option>
                    </select>
                    <button id="darkModeToggle" class="w-10 h-10 bg-white/20 rounded-full backdrop-blur-lg border border-white/30 flex items-center justify-center hover:scale-110 transition">
                        <i class="fas fa-moon text-white dark:hidden"></i>
                        <i class="fas fa-sun text-white hidden dark:inline"></i>
                    </button>
                    
                    <!-- Mobile Menu Button -->
                    <button id="mobileMenuBtn" class="md:hidden w-10 h-10 bg-white/20 rounded-full backdrop-blur-lg border border-white/30 flex items-center justify-center hover:scale-110 transition">
                        <i class="fas fa-bars text-white"></i>
                    </button>
                </div>
            </div>
            
            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden md:hidden mt-4 bg-white/10 backdrop-blur-lg rounded-2xl p-4 border border-white/20">
                <a href="labs.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-flask mr-2"></i>Laboratoriyalar
                </a>
                <a href="categories.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-th-large mr-2"></i>Kategoriyalar
                </a>
                <a href="glossary.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-book mr-2"></i>Lug'at
                </a>
                <a href="about.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-info-circle mr-2"></i>Biz haqimizda
                </a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="hero-section min-h-[50vh] flex items-center justify-center">
        <div class="hero-content px-4 text-center">
            <div class="text-8xl mb-6 animate-bounce">📖</div>
            <h2 class="hero-title text-6xl mb-4">Fizika Lug'ati</h2>
            <p class="text-white/90 text-2xl mb-8 max-w-4xl mx-auto">
                Asosiy fizika tushunchalari va terminlar
            </p>
        </div>
    </section>

    <!-- Search -->
    <section class="py-8 relative">
        <div class="container mx-auto px-4">
            <div class="max-w-2xl mx-auto">
                <div class="search-container">
                    <input type="text" id="glossarySearch" placeholder="🔍 Termin qidirish..." 
                           class="search-input">
                </div>
            </div>
        </div>
    </section>

    <!-- Glossary Content -->
    <section class="py-12 relative">
        <div class="container mx-auto px-4">
            <div class="max-w-6xl mx-auto">
                <div id="glossaryContent" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Loaded by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 bg-black/30 backdrop-blur-lg border-t border-white/10 mt-16">
        <div class="container mx-auto px-4 text-center">
            <p class="text-white/80 text-lg">&copy; 2026 EduSelf</p>
            <p class="text-white/60 mt-2">Educational Virtual Physics Laboratory Portal</p>
        </div>
    </footer>

    <script src="scripts/data.js"></script>
    <script src="scripts/i18n.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        const glossaryTerms = {
            uz: [
                { term: 'Mexanika', def: 'Jismlarning harakati va kuchlar ta\'sirini o\'rganuvchi fizika bo\'limi' },
                { term: 'Elektromagnetizm', def: 'Elektr va magnit hodisalarini o\'rganuvchi fizika bo\'limi' },
                { term: 'Optika', def: 'Yorug\'lik va uning xossalarini o\'rganuvchi fizika bo\'limi' },
                { term: 'Termodinamika', def: 'Issiqlik va energiya o\'zgarishlarini o\'rganuvchi fizika bo\'limi' },
                { term: 'Kvant mexanikasi', def: 'Mikroskopik zarrachalar harakatini o\'rganuvchi fizika bo\'limi' },
                { term: 'Tezlik', def: 'Jismning birlik vaqt ichida bosib o\'tgan yo\'li' },
                { term: 'Tezlanish', def: 'Tezlikning vaqt bo\'yicha o\'zgarish tezligi' },
                { term: 'Kuch', def: 'Jismning harakat holatini o\'zgartiruvchi fizik kattalik' },
                { term: 'Energiya', def: 'Jismning ish bajarish qobiliyati' },
                { term: 'Quvvat', def: 'Birlik vaqt ichida bajarilgan ish' },
                { term: 'Impuls', def: 'Jism massasi va tezligining ko\'paytmasi' },
                { term: 'Moment', def: 'Kuch va uning yelkasining ko\'paytmasi' },
                { term: 'Bosim', def: 'Birlik yuzaga ta\'sir etuvchi kuch' },
                { term: 'Zichlik', def: 'Jismning birlik hajmidagi massasi' },
                { term: 'Temperatura', def: 'Jismning issiqlik holatini xarakterlovchi kattalik' }
            ],
            ru: [
                { term: 'Механика', def: 'Раздел физики, изучающий движение тел и действие сил' },
                { term: 'Электромагнетизм', def: 'Раздел физики, изучающий электрические и магнитные явления' },
                { term: 'Оптика', def: 'Раздел физики, изучающий свет и его свойства' },
                { term: 'Термодинамика', def: 'Раздел физики, изучающий тепло и энергетические превращения' },
                { term: 'Квантовая механика', def: 'Раздел физики, изучающий движение микроскопических частиц' },
                { term: 'Скорость', def: 'Путь, пройденный телом за единицу времени' },
                { term: 'Ускорение', def: 'Скорость изменения скорости по времени' },
                { term: 'Сила', def: 'Физическая величина, изменяющая состояние движения тела' },
                { term: 'Энергия', def: 'Способность тела совершать работу' },
                { term: 'Мощность', def: 'Работа, совершенная за единицу времени' }
            ],
            en: [
                { term: 'Mechanics', def: 'Branch of physics studying motion of bodies and action of forces' },
                { term: 'Electromagnetism', def: 'Branch of physics studying electrical and magnetic phenomena' },
                { term: 'Optics', def: 'Branch of physics studying light and its properties' },
                { term: 'Thermodynamics', def: 'Branch of physics studying heat and energy transformations' },
                { term: 'Quantum Mechanics', def: 'Branch of physics studying motion of microscopic particles' },
                { term: 'Velocity', def: 'Distance traveled by a body per unit time' },
                { term: 'Acceleration', def: 'Rate of change of velocity with respect to time' },
                { term: 'Force', def: 'Physical quantity that changes the state of motion of a body' },
                { term: 'Energy', def: 'Ability of a body to do work' },
                { term: 'Power', def: 'Work done per unit time' }
            ]
        };

        function renderGlossary(terms = null) {
            const content = document.getElementById('glossaryContent');
            const termsToRender = terms || glossaryTerms[currentLang];
            
            content.innerHTML = termsToRender.map(item => `
                <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-6 hover:scale-105 transition-all duration-300 fade-in">
                    <h3 class="text-2xl font-bold text-yellow-300 mb-3 flex items-center">
                        <i class="fas fa-bookmark mr-3"></i>${item.term}
                    </h3>
                    <p class="text-white/90 text-lg leading-relaxed">${item.def}</p>
                </div>
            `).join('');
        }

        document.getElementById('glossarySearch').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (query.length === 0) {
                renderGlossary();
                return;
            }
            
            const filtered = glossaryTerms[currentLang].filter(item => 
                item.term.toLowerCase().includes(query) || 
                item.def.toLowerCase().includes(query)
            );
            renderGlossary(filtered);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderGlossary();
        });
        
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        
        createParticles();
        
        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            
            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    mobileMenu.classList.toggle('hidden');
                });
                
                // Close menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!mobileMenuBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                        mobileMenu.classList.add('hidden');
                    }
                });
                
                // Close menu when clicking a link
                mobileMenu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                    });
                });
            }
        });
    </script>
</body>
</html>
