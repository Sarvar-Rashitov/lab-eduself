<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategoriya - Virtual Fizika Laboratoriyalari</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="animated-bg"></div>
    
    <!-- Navigation -->
    <nav class="py-4">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2 md:space-x-4">
                    <div class="text-2xl md:text-4xl animate-bounce">⚛️</div>
                    <a href="index.html" class="hover:opacity-80 transition">
                        <h1 class="text-sm md:text-2xl font-bold text-white">Virtual Physics Lab</h1>
                        <p class="text-xs md:text-base text-yellow-300 font-semibold">✨ EduSelf</p>
                    </a>
                </div>
                
                <!-- Navigation Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="labs.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-flask mr-2"></i>Laboratoriyalar
                    </a>
                    <a href="categories.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-th-large mr-2"></i>Kategoriyalar
                    </a>
                    <a href="glossary.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-book mr-2"></i>Lug'at
                    </a>
                    <a href="about.html" class="text-white hover:text-yellow-300 transition font-semibold">
                        <i class="fas fa-info-circle mr-2"></i>Biz haqimizda
                    </a>
                </div>
                
                <div class="flex items-center space-x-2 md:space-x-4">
                    <select id="langSwitch" class="bg-white/20 text-white px-2 py-1 md:px-3 md:py-2 rounded-full backdrop-blur-lg border border-white/30 text-xs md:text-sm font-semibold" style="color: white;">
                        <option value="uz" style="background-color: #1e293b; color: white;">UZ</option>
                        <option value="ru" style="background-color: #1e293b; color: white;">RU</option>
                        <option value="en" style="background-color: #1e293b; color: white;">EN</option>
                    </select>
                    <button id="darkModeToggle" class="w-8 h-8 md:w-10 md:h-10 bg-white/20 rounded-full backdrop-blur-lg border border-white/30 flex items-center justify-center hover:scale-110 transition">
                        <i class="fas fa-moon text-white dark:hidden text-sm md:text-base"></i>
                        <i class="fas fa-sun text-white hidden dark:inline text-sm md:text-base"></i>
                    </button>
                    
                    <!-- Mobile Menu Button -->
                    <button id="mobileMenuBtn" class="md:hidden w-8 h-8 bg-white/20 rounded-full backdrop-blur-lg border border-white/30 flex items-center justify-center hover:scale-110 transition">
                        <i class="fas fa-bars text-white text-sm"></i>
                    </button>
                </div>
            </div>
            
            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden md:hidden mt-4 bg-white/10 backdrop-blur-lg rounded-2xl p-4 border border-white/20">
                <a href="labs.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-flask mr-2"></i>Laboratoriyalar
                </a>
                <a href="categories.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-th-large mr-2"></i>Kategoriyalar
                </a>
                <a href="glossary.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-book mr-2"></i>Lug'at
                </a>
                <a href="about.html" class="block text-white hover:text-yellow-300 transition font-semibold py-3 px-4 rounded-lg hover:bg-white/10">
                    <i class="fas fa-info-circle mr-2"></i>Biz haqimizda
                </a>
            </div>
        </div>
    </nav>

    <!-- Category Header -->
    <section id="categoryHeader" class="py-20 text-center">
        <!-- Loaded by JavaScript -->
    </section>

    <!-- Filters -->
    <section class="py-6">
        <div class="container mx-auto px-4">
            <div class="flex flex-wrap gap-4 justify-center">
                <button onclick="filterLabs('all')" class="filter-btn active px-8 py-3 rounded-full bg-white/20 backdrop-blur-lg border border-white/30 text-white hover:bg-white/30 transition font-semibold">
                    <i class="fas fa-th mr-2"></i>Barchasi
                </button>
                <button onclick="filterLabs('school')" class="filter-btn px-8 py-3 rounded-full bg-white/20 backdrop-blur-lg border border-white/30 text-white hover:bg-white/30 transition font-semibold">
                    <i class="fas fa-school mr-2"></i>Maktab
                </button>
                <button onclick="filterLabs('undergraduate')" class="filter-btn px-8 py-3 rounded-full bg-white/20 backdrop-blur-lg border border-white/30 text-white hover:bg-white/30 transition font-semibold">
                    <i class="fas fa-university mr-2"></i>Universitet
                </button>
                <button onclick="filterLabs('advanced')" class="filter-btn px-8 py-3 rounded-full bg-white/20 backdrop-blur-lg border border-white/30 text-white hover:bg-white/30 transition font-semibold">
                    <i class="fas fa-graduation-cap mr-2"></i>Ilg'or
                </button>
            </div>
        </div>
    </section>

    <!-- Labs Grid -->
    <section class="py-16">
        <div class="container mx-auto px-4">
            <div id="labsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Labs loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 bg-black/30 backdrop-blur-lg border-t border-white/10 mt-20">
        <div class="container mx-auto px-4 text-center">
            <p class="text-white/60">&copy; 2026 O'zMU Fizika Fakulteti | physics.eduself.uz</p>
        </div>
    </footer>

    <script src="scripts/data.js"></script>
    <script src="scripts/data-extended.js"></script>
    <script src="scripts/labs-complete.js"></script>
    <script src="scripts/mega-labs.js"></script>
    <script src="scripts/i18n.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('id');
        const category = categories.find(c => c.id === categoryId);
        let currentFilter = 'all';

        if (category) {
            // Render category header
            document.getElementById('categoryHeader').innerHTML = `
                <div class="container mx-auto px-4">
                    <div class="category-icon mx-auto mb-6" style="width: 120px; height: 120px; font-size: 4rem; background: linear-gradient(135deg, ${category.color.replace('from-', '').replace('to-', ', ')})">
                        <i class="fas ${category.icon}"></i>
                    </div>
                    <h2 class="text-6xl font-bold mb-4 text-white">${category[currentLang]}</h2>
                    <p class="text-2xl text-white/80">${laboratories.filter(l => l.category === categoryId).length} ta laboratoriya</p>
                </div>
            `;

            renderAllLabs();
        }

        function renderAllLabs() {
            const grid = document.getElementById('labsGrid');
            let labs = laboratories.filter(lab => lab.category === categoryId);
            
            if (currentFilter !== 'all') {
                labs = labs.filter(lab => lab.difficulty === currentFilter);
            }

            if (labs.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <i class="fas fa-search text-8xl text-white/30 mb-6"></i>
                        <p class="text-3xl text-white/80">Natija topilmadi</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = labs.map(lab => createLabCard(lab)).join('');
        }

        function filterLabs(difficulty) {
            currentFilter = difficulty;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-white/40');
            });
            event.target.classList.add('active', 'bg-white/40');
            
            renderAllLabs();
        }
        
        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            
            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    mobileMenu.classList.toggle('hidden');
                });
                
                // Close menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!mobileMenuBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                        mobileMenu.classList.add('hidden');
                    }
                });
                
                // Close menu when clicking a link
                mobileMenu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                    });
                });
            }
        });
    </script>
</body>
</html>
